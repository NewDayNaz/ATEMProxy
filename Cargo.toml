[workspace]
resolver = "2"
members = [
    "crates/atem-protocol",
    "crates/atem-proxy",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/jonbons/atem-proxy"

[workspace.dependencies]
atem-protocol = { path = "crates/atem-protocol" }
bytes = "1"
thiserror = "2"
tracing = "0.1"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
clap = { version = "4", features = ["derive", "env"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
tokio-util = { version = "0.7", features = ["rt"] }
parking_lot = "0.12"
indexmap = "2"
hex = "0.4"
bitflags = "2"
